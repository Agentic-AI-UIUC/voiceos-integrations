name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2

      - name: No .env files committed
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::.env file committed: remove it and rotate any keys in it"
            exit 1
          fi

      - name: Test changed integrations
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD -- integrations/ | cut -d/ -f1-2 | sort -u)
          else
            changed=$(find integrations -mindepth 1 -maxdepth 1 -type d | sort)
          fi
          failed=""
          for dir in $changed; do
            [ -d "$dir" ] || continue
            echo "::group::$dir"
            if ! (
              cd "$dir"
              if [ -z "$(git ls-files '*.test.ts' '*.test.js')" ]; then
                echo "::error::$dir has no tests - add *.test.ts files for your integration"
                exit 1
              fi
              # VoiceOS ships for Mac and Windows; a Mac-only integration must say why in its README.
              if ! jq -e '.supportedPlatforms | index("win32")' voiceos.integration.json >/dev/null 2>&1 \
                && ! grep -qi 'macos only' README.md 2>/dev/null; then
                msg="$dir doesn't support Windows - add \"win32\" to supportedPlatforms in voiceos.integration.json, or say \"macOS only\" and why in its README.md"
                # ponytail: warn on main so existing Mac-only integrations don't turn main red; PRs must fix it
                if [ "$EVENT" = pull_request ]; then echo "::error::$msg"; exit 1; fi
                echo "::warning::$msg"
              fi
              if [ -f package.json ]; then bun install || exit 1; fi
              bun test
            ); then
              failed="$failed $dir"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::failed:$failed"
            exit 1
          fi
          echo "Checked: ${changed:-nothing}"
